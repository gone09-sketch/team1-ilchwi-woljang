name: Check PR Title Convention

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const pattern = /^\[(feat|fix|refactor|docs|test|chore)\] .+/;

            if (!pattern.test(title)) {
              core.setFailed(
                `PR 제목이 컨벤션을 따르지 않습니다.\n\n` +
                `현재: "${title}"\n` +
                `형식: [타입] 작업 내용\n` +
                `허용 타입: feat, fix, refactor, docs, test, chore\n\n` +
                `예시: [feat] 로그인 API 구현`
              );
            }
