<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOMP 채팅 테스트</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, "Malgun Gothic", sans-serif; background: #f5f7fb; color: #1f2933; }
        main { max-width: 1180px; margin: 0 auto; padding: 24px; }
        h1 { margin: 0 0 18px; font-size: 24px; }
        h2 { margin: 0 0 12px; font-size: 17px; }
        code { font-family: Consolas, monospace; font-size: 12px; }
        .layout { display: grid; grid-template-columns: 390px 1fr; gap: 16px; align-items: start; }
        .panel { background: #fff; border: 1px solid #d8dee8; border-radius: 8px; padding: 16px; }
        .section { padding-top: 16px; margin-top: 16px; border-top: 1px solid #e5eaf1; }
        .section:first-child { padding-top: 0; margin-top: 0; border-top: 0; }
        .field { display: grid; gap: 6px; margin-bottom: 12px; }
        label { font-size: 13px; font-weight: 700; }
        input, select, textarea { width: 100%; border: 1px solid #c8d0dc; border-radius: 6px; padding: 10px; font: inherit; background: #fff; }
        textarea { min-height: 84px; resize: vertical; }
        button { min-height: 38px; border: 1px solid #2563eb; border-radius: 6px; padding: 8px 12px; font: inherit; font-weight: 700; color: #fff; background: #2563eb; cursor: pointer; }
        button.secondary { border-color: #8a95a6; color: #1f2933; background: #fff; }
        button.danger { border-color: #dc2626; background: #dc2626; }
        button:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        .status { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #eef2f7; color: #52606d; }
        .status.connected { background: #dcfce7; color: #166534; }
        .status.error { background: #fee2e2; color: #991b1b; }
        .notice { margin: 0 0 16px; padding: 12px 14px; border: 1px solid #d8dee8; border-radius: 8px; background: #fff; color: #52606d; font-size: 13px; line-height: 1.5; }
        .notice.error { border-color: #fca5a5; background: #fee2e2; color: #991b1b; font-weight: 700; }
        .messages { height: 540px; overflow: auto; border: 1px solid #d8dee8; border-radius: 8px; padding: 12px; background: #f8fafc; }
        .message { margin-bottom: 8px; padding: 9px 10px; border: 1px solid #e1e7ef; border-radius: 6px; background: #fff; white-space: pre-wrap; word-break: break-word; }
        .message.system { color: #52606d; background: #eef2f7; }
        .message.error { color: #991b1b; background: #fee2e2; }
        .message .meta { display: block; margin-bottom: 4px; color: #52606d; font-size: 12px; font-weight: 700; }
        .result, .hint { margin: 8px 0 0; color: #52606d; font-size: 12px; line-height: 1.5; }
        .result { min-height: 20px; font-weight: 700; }
        .result.success { color: #166534; }
        .result.error { color: #991b1b; }
        @media (max-width: 920px) { main { padding: 16px; } .layout { grid-template-columns: 1fr; } .messages { height: 360px; } }
    </style>
</head>
<body>
<main>
    <h1>STOMP 채팅 테스트</h1>
    <div id="pageNotice" class="notice"></div>
    <div class="layout">
        <section class="panel">
            <div class="section">
                <h2>1. 인증</h2>
                <div class="field"><label for="email">이메일</label><input id="email" type="email" placeholder="member@example.com"></div>
                <div class="field"><label for="password">비밀번호</label><input id="password" type="password" placeholder="password"></div>
                <div class="field"><label for="name">이름</label><input id="name" type="text" placeholder="홍길동"></div>
                <div class="field"><label for="phone">전화번호</label><input id="phone" type="text" placeholder="010-1234-5678"></div>
                <div class="row">
                    <button type="button" id="signupButton">회원가입</button>
                    <button type="button" id="loginButton">로그인</button>
                    <button type="button" class="secondary" id="refreshButton">토큰 재발급</button>
                    <button type="button" class="secondary" id="clearTokenButton">토큰 삭제</button>
                </div>
                <div id="authResult" class="result">로그인하면 Access Token이 저장됩니다.</div>
                <div class="field" style="margin-top: 12px;"><label for="accessToken">Access Token</label><textarea id="accessToken" placeholder="로그인 성공 시 자동 입력됩니다."></textarea></div>
            </div>
            <div class="section">
                <h2>2. 채팅방</h2>
                <div class="row">
                    <button type="button" id="createRoomButton">내 채팅방 생성</button>
                    <button type="button" class="secondary" id="getRoomButton">내 채팅방 조회</button>
                </div>
                <div class="field" style="margin-top: 12px;"><label for="chatRoomId">채팅방 ID</label><input id="chatRoomId" type="number" min="1" placeholder="생성 또는 조회 후 자동 입력"></div>
                <div class="field"><label for="chatRoomStatus">문의 상태</label><input id="chatRoomStatus" type="text" readonly></div>
                <div id="roomResult" class="result">채팅방을 먼저 생성하거나 조회하세요.</div>
            </div>
            <div class="section">
                <h2>3. 관리자 기능</h2>
                <div class="field">
                    <label for="roomStatusFilter">상태 필터</label>
                    <select id="roomStatusFilter"><option value="">전체</option><option value="WAITING">WAITING</option><option value="IN_PROGRESS">IN_PROGRESS</option><option value="COMPLETED">COMPLETED</option></select>
                </div>
                <div class="field">
                    <label for="nextRoomStatus">변경할 상태</label>
                    <select id="nextRoomStatus"><option value="IN_PROGRESS">IN_PROGRESS</option><option value="COMPLETED">COMPLETED</option></select>
                </div>
                <div class="row">
                    <button type="button" class="secondary" id="loadRoomsButton">채팅방 목록 조회</button>
                    <button type="button" class="secondary" id="changeRoomStatusButton">상태 변경</button>
                </div>
                <p class="hint">채팅방 전체 목록 조회와 상태 변경은 관리자 권한 토큰으로만 성공합니다.</p>
            </div>
            <div class="section">
                <h2>4. STOMP</h2>
                <div class="row">
                    <button type="button" id="connectButton">연결</button>
                    <button type="button" class="danger" id="disconnectButton" disabled>연결 종료</button>
                </div>
                <p class="hint">CONNECT <code>/ws/chat</code>, SEND <code>/pub/chat/rooms/{chatRoomId}/messages</code>, SUBSCRIBE <code>/sub/chat/rooms/{chatRoomId}</code></p>
            </div>
        </section>
        <section class="panel">
            <h2>채팅</h2>
            <div id="connectionStatus" class="status">연결 안 됨</div>
            <div id="messages" class="messages"></div>
            <div class="field" style="margin-top: 12px;"><label for="messageInput">메시지</label><textarea id="messageInput" placeholder="보낼 메시지를 입력하세요." disabled></textarea></div>
            <div class="row">
                <button type="button" id="sendButton" disabled>메시지 보내기</button>
                <button type="button" class="secondary" id="loadMessagesButton">전체 메시지 조회</button>
                <button type="button" class="secondary" id="recoverMessagesButton">미수신 메시지 복구</button>
                <button type="button" class="secondary" id="clearMessagesButton">화면 비우기</button>
            </div>
        </section>
    </div>
</main>
<script>
    const $ = (id) => document.getElementById(id);
    const emailInput = $("email");
    const passwordInput = $("password");
    const nameInput = $("name");
    const phoneInput = $("phone");
    const accessTokenInput = $("accessToken");
    const chatRoomIdInput = $("chatRoomId");
    const chatRoomStatusInput = $("chatRoomStatus");
    const messageInput = $("messageInput");
    const messages = $("messages");
    const connectionStatus = $("connectionStatus");
    const authResult = $("authResult");
    const roomResult = $("roomResult");
    const pageNotice = $("pageNotice");
    const roomStatusFilter = $("roomStatusFilter");
    const nextRoomStatus = $("nextRoomStatus");
    const subscriptionId = "chat-room-subscription";
    let socket = null;
    let reconnectTimer = null;
    let reconnectAttempts = 0;
    let manualDisconnect = false;
    let currentChatRoomStatus = "";

    restoreSavedState();
    initializePageNotice();

    $("signupButton").addEventListener("click", signup);
    $("loginButton").addEventListener("click", login);
    $("refreshButton").addEventListener("click", refreshAccessToken);
    $("clearTokenButton").addEventListener("click", clearToken);
    $("createRoomButton").addEventListener("click", createMyChatRoom);
    $("getRoomButton").addEventListener("click", getMyChatRoom);
    $("connectButton").addEventListener("click", connectStomp);
    $("disconnectButton").addEventListener("click", disconnectStomp);
    $("sendButton").addEventListener("click", sendMessage);
    $("loadMessagesButton").addEventListener("click", () => loadMessages(false));
    $("recoverMessagesButton").addEventListener("click", recoverMissedMessages);
    $("clearMessagesButton").addEventListener("click", () => messages.innerHTML = "");
    $("loadRoomsButton").addEventListener("click", loadChatRooms);
    $("changeRoomStatusButton").addEventListener("click", changeRoomStatus);
    messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    async function signup() {
        const request = {email: emailInput.value.trim(), password: passwordInput.value, name: nameInput.value.trim(), phone: phoneInput.value.trim()};
        if (!request.email || !request.password || !request.name || !request.phone) {
            setResult(authResult, "Fill all sign-up fields.", "error");
            return;
        }
        try {
            const body = await requestJson("/api/auth/signup", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(request)});
            localStorage.setItem("chatTestEmail", request.email);
            setResult(authResult, `Sign-up success: memberId=${body.data.memberId}`, "success");
            appendSystem("Sign-up completed. Log in with the same account.");
        } catch (error) {
            setResult(authResult, error.message, "error");
            appendError("Sign-up failed: " + error.message);
        }
    }

    async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        if (!email || !password) {
            setResult(authResult, "Fill email and password.", "error");
            return;
        }
        try {
            const body = await requestJson("/api/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({email, password})});
            saveAccessToken(body.data.accessToken);
            localStorage.setItem("chatTestEmail", email);
            setResult(authResult, "Login success.", "success");
            appendSystem("Access token saved.");
        } catch (error) {
            setResult(authResult, error.message, "error");
            appendError("Login failed: " + error.message);
        }
    }

    async function refreshAccessToken() {
        const body = await requestJson("/api/auth/refresh", {method: "POST", credentials: "same-origin"});
        saveAccessToken(body.data.accessToken);
        setResult(authResult, "Token refresh success.", "success");
        appendSystem("Access token refreshed.");
        return body.data.accessToken;
    }

    async function createMyChatRoom() {
        try {
            const body = await requestJsonWithAuth("/api/chat/rooms/my", {method: "POST"});
            applyChatRoom(body.data);
            setResult(roomResult, `Room created: ${body.data.chatRoomId}`, "success");
            appendSystem(`Room created: chatRoomId=${body.data.chatRoomId}, status=${body.data.status}`);
        } catch (error) {
            setResult(roomResult, error.message, "error");
            appendError("Create room failed: " + error.message);
        }
    }

    async function getMyChatRoom() {
        try {
            const body = await requestJsonWithAuth("/api/chat/rooms/my", {method: "GET"});
            applyChatRoom(body.data);
            setResult(roomResult, `Room loaded: ${body.data.chatRoomId}`, "success");
            appendSystem(`Room loaded: chatRoomId=${body.data.chatRoomId}, status=${body.data.status}`);
        } catch (error) {
            setResult(roomResult, error.message, "error");
            appendError("Load room failed: " + error.message);
        }
    }

    async function loadChatRooms() {
        const status = roomStatusFilter.value;
        const query = status ? `?status=${encodeURIComponent(status)}` : "";
        try {
            const body = await requestJsonWithAuth("/api/chat/rooms" + query, {method: "GET"});
            appendSystem(`${status || "ALL"} rooms: ${body.data.length}`);
            body.data.forEach((room) => appendSystem(`room=${room.chatRoomId}, member=${room.memberId}, status=${room.status}, updatedAt=${formatDateTime(room.updatedAt)}, createdAt=${formatDateTime(room.createdAt)}`));
        } catch (error) {
            appendError("Load rooms failed: " + error.message);
        }
    }

    async function changeRoomStatus() {
        const chatRoomId = requireChatRoomId();
        if (!chatRoomId) return;
        try {
            const body = await requestJsonWithAuth(`/api/chat/rooms/${chatRoomId}/status`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: nextRoomStatus.value})});
            applyChatRoom(body.data);
            appendSystem(`Status changed: chatRoomId=${body.data.chatRoomId}, status=${body.data.status}`);
        } catch (error) {
            appendError("Change status failed: " + error.message);
        }
    }

    function connectStomp() {
        const chatRoomId = requireChatRoomId();
        const accessToken = requireAccessToken();
        if (!chatRoomId || !accessToken) return;
        if (socket && socket.readyState === WebSocket.OPEN) {
            appendSystem("STOMP connection is already open.");
            return;
        }
        manualDisconnect = false;
        setConnected(false, "Connecting");
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        socket = new WebSocket(`${protocol}//${window.location.host}/ws/chat`);
        socket.onopen = () => {
            reconnectAttempts = 0;
            sendFrame("CONNECT", {"accept-version": "1.2", "heart-beat": "10000,10000", "Authorization": "Bearer " + accessToken});
        };
        socket.onmessage = (event) => handleStompData(event.data);
        socket.onerror = () => {
            setConnected(false, "Error", "error");
            appendError("STOMP connection error.");
        };
        socket.onclose = (event) => {
            setConnected(false, "Closed");
            appendSystem(`STOMP closed: code=${event.code}, reason=${event.reason || "none"}`);
            if (!manualDisconnect) scheduleReconnect();
        };
    }

    function disconnectStomp() {
        manualDisconnect = true;
        clearTimeout(reconnectTimer);
        if (socket && socket.readyState === WebSocket.OPEN) {
            sendFrame("UNSUBSCRIBE", {id: subscriptionId});
            sendFrame("DISCONNECT", {});
        }
        if (socket) {
            socket.close();
            socket = null;
        }
        setConnected(false, "Disconnected");
    }

    function sendMessage() {
        const chatRoomId = requireChatRoomId();
        const content = messageInput.value.trim();
        if (!chatRoomId || !content) return;
        if (content.length > 1000) {
            appendError("Message must be 1000 characters or less.");
            return;
        }
        if (!socket || socket.readyState !== WebSocket.OPEN) {
            appendError("Connect STOMP before sending a message.");
            return;
        }
        if (currentChatRoomStatus === "COMPLETED") {
            appendError("Cannot send messages to a completed room.");
            return;
        }
        sendFrame("SEND", {destination: `/pub/chat/rooms/${chatRoomId}/messages`, "content-type": "application/json"}, JSON.stringify({content}));
        messageInput.value = "";
        messageInput.focus();
    }

    async function loadMessages(onlyMissed) {
        const chatRoomId = requireChatRoomId();
        if (!chatRoomId) return;
        const lastReceivedMessageId = getLastReceivedMessageId(chatRoomId);
        const query = onlyMissed && lastReceivedMessageId > 0 ? `?afterMessageId=${lastReceivedMessageId}` : "";
        try {
            const body = await requestJsonWithAuth(`/api/chat/rooms/${chatRoomId}/messages${query}`, {method: "GET"});
            appendSystem(`${onlyMissed ? "Missed" : "All"} messages: ${body.data.length}`);
            body.data.forEach(appendChatMessage);
        } catch (error) {
            appendError("Load messages failed: " + error.message);
        }
    }

    async function recoverMissedMessages() {
        await loadMessages(true);
    }

    function handleStompData(data) {
        data.split("\u0000").filter((frame) => frame.trim() !== "").forEach((rawFrame) => {
            const frame = parseFrame(rawFrame);
            if (frame.command === "CONNECTED") {
                subscribeCurrentRoom();
                setConnected(true, "Connected");
                appendSystem("STOMP CONNECTED.");
                recoverMissedMessages();
                return;
            }
            if (frame.command === "MESSAGE") {
                appendServerMessage(frame.body);
                return;
            }
            if (frame.command === "ERROR") appendError("STOMP ERROR: " + (frame.body || JSON.stringify(frame.headers)));
        });
    }

    function subscribeCurrentRoom() {
        const chatRoomId = requireChatRoomId();
        if (!chatRoomId) return;
        sendFrame("SUBSCRIBE", {id: subscriptionId, destination: `/sub/chat/rooms/${chatRoomId}`, ack: "auto"});
        appendSystem(`/sub/chat/rooms/${chatRoomId} subscribed.`);
    }

    function appendServerMessage(body) {
        try {
            const message = JSON.parse(body);
            if (message.messageId) {
                appendChatMessage(message);
                return;
            }
            appendSystem(`${message.content || body} (${formatDateTime(message.createdAt)})`);
        } catch (error) {
            appendSystem(body);
        }
    }

    function appendChatMessage(message) {
        const messageId = Number(message.messageId || 0);
        const chatRoomId = String(message.chatRoomId || "");
        if (messageId > 0 && chatRoomId) updateLastReceivedMessageId(chatRoomId, messageId);
        const element = document.createElement("div");
        element.className = "message";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `#${message.messageId} ${message.senderRole}:${message.senderId} / room=${message.chatRoomId} / ${formatDateTime(message.createdAt)}`;
        const content = document.createElement("span");
        content.textContent = message.content;
        element.appendChild(meta);
        element.appendChild(content);
        messages.appendChild(element);
        scrollMessagesToBottom();
    }

    function sendFrame(command, headers = {}, body = "") {
        const headerLines = Object.entries(headers).map(([key, value]) => `${key}:${value}`).join("\n");
        socket.send(`${command}\n${headerLines}\n\n${body}\u0000`);
    }

    function parseFrame(rawFrame) {
        const splitIndex = rawFrame.indexOf("\n\n");
        const headerPart = splitIndex >= 0 ? rawFrame.slice(0, splitIndex) : rawFrame;
        const body = splitIndex >= 0 ? rawFrame.slice(splitIndex + 2) : "";
        const headerLines = headerPart.split("\n");
        const command = headerLines.shift();
        const headers = {};
        headerLines.forEach((line) => {
            const colonIndex = line.indexOf(":");
            if (colonIndex > 0) headers[line.slice(0, colonIndex)] = line.slice(colonIndex + 1);
        });
        return {command, headers, body};
    }

    async function requestJsonWithAuth(path, options = {}, retry = true) {
        const accessToken = requireAccessToken();
        if (!accessToken) throw new Error("Access token is required.");
        const headers = new Headers(options.headers || {});
        headers.set("Authorization", "Bearer " + accessToken);
        try {
            return await requestJson(path, {...options, headers});
        } catch (error) {
            if (retry && error.status === 401) {
                const newAccessToken = await refreshAccessToken();
                headers.set("Authorization", "Bearer " + newAccessToken);
                return requestJson(path, {...options, headers});
            }
            throw error;
        }
    }

    async function requestJson(path, options = {}) {
        const response = await fetch(path, {credentials: "same-origin", ...options});
        const text = await response.text();
        const body = text ? JSON.parse(text) : {};
        if (!response.ok || body.success === false) {
            const error = new Error(body.message || `HTTP ${response.status}`);
            error.status = response.status;
            error.body = body;
            throw error;
        }
        return body;
    }

    function scheduleReconnect() {
        const chatRoomId = chatRoomIdInput.value.trim();
        const accessToken = accessTokenInput.value.trim();
        if (!chatRoomId || !accessToken) return;
        reconnectAttempts += 1;
        const delay = Math.min(1000 * reconnectAttempts, 10000);
        appendSystem(`Reconnect in ${delay / 1000}s.`);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => refreshAccessToken().catch(() => null).finally(connectStomp), delay);
    }

    function applyChatRoom(chatRoom) {
        chatRoomIdInput.value = chatRoom.chatRoomId;
        chatRoomStatusInput.value = chatRoom.status;
        currentChatRoomStatus = chatRoom.status;
        localStorage.setItem("chatTestChatRoomId", chatRoom.chatRoomId);
        updateSendEnabled();
    }

    function saveAccessToken(accessToken) {
        accessTokenInput.value = accessToken;
        localStorage.setItem("chatTestAccessToken", accessToken);
    }

    function getLastReceivedMessageId(chatRoomId) {
        return Number(localStorage.getItem(lastMessageIdStorageKey(chatRoomId)) || "0");
    }

    function updateLastReceivedMessageId(chatRoomId, messageId) {
        const currentMessageId = getLastReceivedMessageId(chatRoomId);
        localStorage.setItem(lastMessageIdStorageKey(chatRoomId), String(Math.max(currentMessageId, messageId)));
    }

    function lastMessageIdStorageKey(chatRoomId) {
        return `chatTestLastMessageId:${chatRoomId}`;
    }

    function clearToken() {
        accessTokenInput.value = "";
        localStorage.removeItem("chatTestAccessToken");
        appendSystem("Access token cleared.");
    }

    function restoreSavedState() {
        emailInput.value = localStorage.getItem("chatTestEmail") || "";
        accessTokenInput.value = localStorage.getItem("chatTestAccessToken") || "";
        chatRoomIdInput.value = localStorage.getItem("chatTestChatRoomId") || "";
    }

    function requireAccessToken() {
        const accessToken = accessTokenInput.value.trim();
        if (!accessToken) {
            appendError("Log in first.");
            return "";
        }
        return accessToken;
    }

    function requireChatRoomId() {
        const chatRoomId = chatRoomIdInput.value.trim();
        if (!chatRoomId) {
            appendError("Create or load a chat room first.");
            return "";
        }
        return chatRoomId;
    }

    function setConnected(connected, text, type = "") {
        $("connectButton").disabled = connected;
        $("disconnectButton").disabled = !connected;
        connectionStatus.textContent = text;
        connectionStatus.className = type ? `status ${type}` : connected ? "status connected" : "status";
        updateSendEnabled();
    }

    function updateSendEnabled() {
        const connected = socket && socket.readyState === WebSocket.OPEN;
        const disabled = !connected || currentChatRoomStatus === "COMPLETED";
        $("sendButton").disabled = disabled;
        messageInput.disabled = disabled;
    }

    function setResult(element, text, type = "") {
        element.textContent = text;
        element.className = type ? `result ${type}` : "result";
    }

    function appendSystem(text) { appendMessage(text, "system"); }
    function appendError(text) { appendMessage(text, "error"); }
    function appendMessage(text, type = "") {
        const element = document.createElement("div");
        element.className = type ? `message ${type}` : "message";
        element.textContent = text;
        messages.appendChild(element);
        scrollMessagesToBottom();
    }
    function scrollMessagesToBottom() { messages.scrollTop = messages.scrollHeight; }
    function formatDateTime(value) { return value ? String(value).replace("T", " ") : "-"; }
    function initializePageNotice() {
        if (window.location.protocol === "file:") {
            pageNotice.className = "notice error";
            pageNotice.textContent = "Open this page through Spring Boot. Use http://localhost:8080/chat-test.html";
            return;
        }
        pageNotice.textContent = `Origin: ${window.location.origin}. This local page uses the backend STOMP contract.`;
    }
</script>
</body>
</html>
