server:
  tomcat:
    keep-alive-timeout: 60000
    max-keep-alive-requests: 100

spring:
  application:
    name: team1-ilchwi-woljang

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  mvc:
    servlet:
      load-on-startup: 1

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 10
      initialization-fail-timeout: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}



jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

cookie:
  secure: ${COOKIE_SECURE:false}

chat:
  websocket:
    allowed-origin-patterns: ${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080,http://127.0.0.1:8080}
